<!DOCTYPE html>
<html>
<head>
    <title>Your Score</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .score-container {
            background: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: #050505;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .score-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }

        #score {
            color: #1877f2;
            font-size: 48px;
            font-weight: 700;
            margin: 20px 0;
            padding: 30px;
            background: #e7f3ff;
            border-radius: 8px;
            border: 2px solid #1877f2;
        }

        #score.error {
            color: #d93025;
            background: #fce8e6;
            border-color: #d93025;
            font-size: 18px;
            font-weight: 500;
        }

        .loading {
            color: #65676b;
            font-size: 18px;
            font-style: italic;
        }

        .back-button {
            margin-top: 30px;
            padding: 12px 32px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: #166fe5;
        }

        @media (max-width: 768px) {
            .score-container {
                padding: 40px 30px;
            }

            h2 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            .score-icon {
                font-size: 56px;
            }

            #score {
                font-size: 36px;
                padding: 20px;
            }

            #score.error {
                font-size: 16px;
            }

            .back-button {
                padding: 10px 24px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="score-container">
    <span class="score-icon">🏆</span>
    <h2>Your Score</h2>
    <p id="score" class="loading">Loading...</p>
    <a href="../user/user-dashboard.html" class="back-button">Back to Dashboard</a>
</div>

<script>
    const API = "http://localhost:9090";
    const userId = localStorage.getItem("userId");

    fetch(API + "/quiz/score/" + userId)
    .then(res => res.text())
    .then(data => document.getElementById("score").innerText = data)
    .catch(err => {
        const scoreElement = document.getElementById("score");
        scoreElement.innerText = "Unable to load score. Please try again.";
        scoreElement.classList.add("error");
    });
</script>

</body>
</html>
